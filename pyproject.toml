[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "rhll"
version = "0.1.0"
description = "Rust-powered HyperLogLog for Python"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/f4hy/rhll"
Repository = "https://github.com/f4hy/rhll"
Issues = "https://github.com/f4hy/rhll/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-benchmark",
    "datasketch",
    "HLL",
    "ruff==0.15.21",
]

[tool.maturin]
module-name = "rhll._rhll"
python-source = "python"

[tool.ruff]
line-length = 100

